stream {
    log_format udp_debug '$remote_addr [$time_local] '
                         '$protocol $status $bytes_sent $bytes_received '
                         '$session_time "$upstream_addr"';

    upstream backend_server {
        server 94.26.229.210:25564;
    }

    server {
        listen 25564 udp;
        proxy_pass backend_server;
        proxy_timeout 10s;
        proxy_responses 100;
        error_log /var/log/nginx/udp_proxy.log debug;
        access_log /var/log/nginx/udp_access.log udp_debug;
    }

    upstream backend_server2 {
        server 94.26.229.210:25567;
    }

    server {
        listen 25567 udp;
        proxy_pass backend_server2;
        proxy_timeout 10s;
        proxy_responses 100;
        error_log /var/log/nginx/udp_proxy.log debug;
        access_log /var/log/nginx/udp_access.log udp_debug;
    }
}
