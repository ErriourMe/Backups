lobal
    log /dev/log local0
    log /dev/log local1 notice
    user haproxy
    group haproxy
    daemon

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 2h
    timeout server 2h

# Первый сервер (порт 25565)
frontend minecraft_front_25565
    bind *:25565
    default_backend minecraft_back_25565

backend minecraft_back_25565
    server mc_server 87.228.53.150:25565 check

# Второй сервер (порт 25566)
frontend minecraft_front_25566
    bind *:25566
    default_backend minecraft_back_25566

backend minecraft_back_25566
    server mc_server 87.228.53.150:25566 check


# Третий сервер (порт 25567)
frontend minecraft_front_25567
    bind *:25567
    default_backend minecraft_back_25567

backend minecraft_back_25567
    server mc_server_3 87.228.53.150:25567 check

# Третий сервер (порт 25569)
frontend minecraft_front_25569
    bind *:25569
    default_backend minecraft_back_25569

backend minecraft_back_25569
    server mc_server_3 87.228.53.150:25569 check
